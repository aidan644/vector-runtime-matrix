name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-safe-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run deterministic gate
        run: python -B runner/run_matrix.py matrix/base.json --out out/base

      - name: Upload public-safe summaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-matrix-base
          path: out/base
          if-no-files-found: error
          retention-days: 7
